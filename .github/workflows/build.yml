name: Linux desktop, tests and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          NEURA_DATA_DIR: /tmp/neura-ci-data
  release_plan:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this application version needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+',version): raise ValueError('Invalid VERSION')
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/v'+version
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request,timeout=20) as response: release=json.load(response)
              build=bool(release.get('draft',False))
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              build=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('build='+str(build).lower()+'\n')
          PYCODE
  linux-package:
    if: github.event_name != 'pull_request' && needs.release_plan.outputs.build == 'true'
    needs: [tests, release_plan]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install Arch build tools
        run: pacman -Syu --noconfirm --needed git python python-pip python-numpy cmake ninja vulkan-headers vulkan-icd-loader shaderc glslang spirv-tools spirv-headers zstd sudo
      - uses: actions/checkout@v4
      - name: Build a pinned Vulkan runtime
        env:
          CMAKE_ARGS: '-DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF'
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3,14), "Rebuild the package metadata for the new Python ABI"'
          python -m venv /tmp/neura-build-env
          /tmp/neura-build-env/bin/python -m pip install --upgrade pip
          /tmp/neura-build-env/bin/python -m pip install --target vendor -r requirements-backend.txt
          /tmp/neura-build-env/bin/python -m pip install --target vendor --no-deps --no-binary=llama-cpp-python -r requirements-inference.txt
          /tmp/neura-build-env/bin/python -m pip install --target vendor diskcache==5.6.3 Jinja2==3.1.6
          PYTHONPATH=vendor python -c 'import llama_cpp; print(llama_cpp.__version__)'
      - name: Build pacman and AUR artifacts as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder python tools/build_linux_release.py --vendor vendor --output release
      - uses: actions/upload-artifact@v4
        with:
          name: neura-linux-${{ github.sha }}
          path: release/
      - name: Read version
        id: version
        run: |
          version="$(cat VERSION)"
          notes="docs/RELEASE_v${version}_AR.md"
          test -f "$notes"
          printf 'tag=v%s\nnotes=%s\n' "$version" "$notes" >> "$GITHUB_OUTPUT"
      - name: Detect existing published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+os.environ['TAG']
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request) as response: release=json.load(response)
              exists=not release.get('draft',False)
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              exists=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('exists='+str(exists).lower()+'\n')
          PY
      - name: Publish stable Linux release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Neura AI ${{ steps.version.outputs.tag }} — Linux Desktop
          body_path: ${{ steps.version.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            release/*.pkg.tar.zst
            release/neura-ai-*-linux-x86_64.tar.zst
            release/*-aur.tar.gz
            release/SHA256SUMS.txt
            release/install.sh
            release/install.py
