name: Build Neura Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse src package/src
          Copy-Item install.bat package/ -ErrorAction SilentlyContinue
          Copy-Item run.bat package/ -ErrorAction SilentlyContinue
          Copy-Item requirements.txt package/ -ErrorAction SilentlyContinue
          Copy-Item README.md package/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE package/ -ErrorAction SilentlyContinue
          Compress-Archive -Path package/* -DestinationPath Neura-Portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neura-Portable
          path: Neura-Portable.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Neura-Portable.zip
