name: Build Neura Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install flet SpeechRecognition pyttsx3 PyGithub requests

      - name: Build launcher exe
        run: pyinstaller --onefile --windowed --icon=assets/neura.ico --name=Neura --distpath dist --workpath build src/launcher.py

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist/Neura.exe pkg/
          Copy-Item -Recurse src pkg/src
          Copy-Item install.bat pkg/ -ErrorAction SilentlyContinue
          Copy-Item run.bat pkg/ -ErrorAction SilentlyContinue
          Copy-Item requirements.txt pkg/ -ErrorAction SilentlyContinue
          Copy-Item README.md pkg/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE pkg/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse assets pkg/assets -ErrorAction SilentlyContinue
          Copy-Item -Recurse tools pkg/tools -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path pkg/models | Out-Null
          New-Item -ItemType Directory -Force -Path pkg/data | Out-Null

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path pkg/* -DestinationPath "Neura-Portable-${{ github.ref_name }}.zip"

      - name: Create partial update zip
        run: python tools/make_update_zip.py ${{ github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neura-Build-${{ github.ref_name }}
          path: |
            Neura-Portable-*.zip
            Neura-Update-*.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Neura-Portable-*.zip
            Neura-Update-*.zip
          generate_release_notes: true
